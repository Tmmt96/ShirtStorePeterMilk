# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - petermilk-store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore src/ShirtStore.Web/ShirtStore.Web.csproj

      - name: Build with dotnet
        run: dotnet build src/ShirtStore.Web/ShirtStore.Web.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish src/ShirtStore.Web/ShirtStore.Web.csproj -c Release --no-restore -o ${{github.workspace}}/publish

      - name: Verify publish contents
        shell: bash
        run: |
          test -f "${{github.workspace}}/publish/ShirtStore.Web.dll"
          test -f "${{github.workspace}}/publish/Mono.Cecil.dll"
          if find "${{github.workspace}}/publish" -type f \( -iname '*Tests.dll' -o -iname '*Test.dll' \) | grep -q .; then
            echo "Test assemblies must not be published"
            find "${{github.workspace}}/publish" -type f \( -iname '*Tests.dll' -o -iname '*Test.dll' \)
            exit 1
          fi
          if grep -R -a -q 'ShirtStore.IntegrationTests' "${{github.workspace}}/publish"; then
            echo "Publish output contains a reference to ShirtStore.IntegrationTests"
            exit 1
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{github.workspace}}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D3F8D94B742E41B19884066687890F50 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B1EE67388AA4ECEBC7FCA8E8B21E30C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E5A70178E3934D60A809EC29D27A655E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'petermilk-store'
          slot-name: 'Production'
          package: .
          target-path: '/home/site/wwwroot'
          clean: true
          restart: true
          